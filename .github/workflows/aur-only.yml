name: Publish to AUR (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without v prefix, e.g., 0.2.18)'
        required: true

jobs:
  publish-aur:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Download and get SHA256
        id: sha256
        run: |
          URL="https://github.com/OutrageLabs/terX/releases/download/v${VERSION}/terx-bin-${VERSION}-1-x86_64.pkg.tar.zst"
          curl -sLO "$URL"
          SHA256=$(sha256sum "terx-bin-${VERSION}-1-x86_64.pkg.tar.zst" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Generate PKGBUILD
        env:
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          cat > PKGBUILD << EOF
          # Maintainer: kofany <j@dabrowski.biz>
          pkgname=terx-bin
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="Cross-platform SSH client with GPU-accelerated terminal rendering"
          arch=('x86_64')
          url="https://github.com/OutrageLabs/terX"
          license=('custom:proprietary')
          depends=(
              'webkit2gtk-4.1'
              'gtk3'
              'glib2'
              'gdk-pixbuf2'
              'cairo'
              'pango'
              'libsoup3'
              'openssl'
              'hicolor-icon-theme'
          )
          optdepends=(
              'libappindicator-gtk3: system tray support'
              'gst-plugins-good: video/audio support'
          )
          provides=('terx')
          conflicts=('terx')
          options=('!strip' '!debug')
          source=("terx-bin-\${pkgver}.pkg.tar.zst::https://github.com/OutrageLabs/terX/releases/download/v\${pkgver}/terx-bin-\${pkgver}-1-x86_64.pkg.tar.zst")
          sha256sums=('${SHA256}')
          noextract=("terx-bin-\${pkgver}.pkg.tar.zst")

          package() {
              cd "\${srcdir}"
              bsdtar -xf "terx-bin-\${pkgver}.pkg.tar.zst" -C "\${pkgdir}/"
              rm -f "\${pkgdir}/.PKGINFO" "\${pkgdir}/.BUILDINFO" "\${pkgdir}/.MTREE" 2>/dev/null || true
          }
          EOF

      - name: Generate .SRCINFO
        env:
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          cat > .SRCINFO << EOF
          pkgbase = terx-bin
          	pkgdesc = Cross-platform SSH client with GPU-accelerated terminal rendering
          	pkgver = ${VERSION}
          	pkgrel = 1
          	url = https://github.com/OutrageLabs/terX
          	arch = x86_64
          	license = custom:proprietary
          	depends = webkit2gtk-4.1
          	depends = gtk3
          	depends = glib2
          	depends = gdk-pixbuf2
          	depends = cairo
          	depends = pango
          	depends = libsoup3
          	depends = openssl
          	depends = hicolor-icon-theme
          	optdepends = libappindicator-gtk3: system tray support
          	optdepends = gst-plugins-good: video/audio support
          	provides = terx
          	conflicts = terx
          	options = !strip
          	options = !debug
          	noextract = terx-bin-${VERSION}.pkg.tar.zst
          	source = terx-bin-${VERSION}.pkg.tar.zst::https://github.com/OutrageLabs/terX/releases/download/v${VERSION}/terx-bin-${VERSION}-1-x86_64.pkg.tar.zst
          	sha256sums = ${SHA256}

          pkgname = terx-bin
          EOF

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: terx-bin
          pkgbuild: ./PKGBUILD
          commit_username: kofany
          commit_email: j@dabrowski.biz
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.event.inputs.version }}"
          assets: .SRCINFO
