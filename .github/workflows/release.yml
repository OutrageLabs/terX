# This workflow runs in PUBLIC repo (OutrageLabs/terX)
# Checks out source from PRIVATE repo, builds, and publishes release here
#
# Usage: Manually trigger from Actions tab with version (e.g., "v0.2.13")
# Or push a tag to this repo

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.2.13)'
        required: true

permissions:
  contents: write

env:
  # Use input version for workflow_dispatch, or tag name for tag push
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: macos-13
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: OutrageLabs/terx-source
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.VERSION }}
          submodules: false

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        run: bun run tauri build --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: ignore

  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel git rust nodejs \
            webkit2gtk-4.1 gtk3 libsoup3 openssl \
            libappindicator-gtk3 librsvg \
            curl wget file patchelf unzip zstd

      - name: Install Bun
        run: |
          curl -fsSL https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip -o bun.zip
          unzip bun.zip
          mv bun-linux-x64/bun /usr/local/bin/bun
          chmod +x /usr/local/bin/bun

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: OutrageLabs/terx-source
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.VERSION }}
          submodules: false

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build Rust binary
        run: cd src-tauri && cargo build --release

      - name: Create Arch package
        env:
          PKG_VERSION: ${{ env.VERSION }}
        run: |
          VERSION="${PKG_VERSION#v}"
          PKG_NAME="terx-bin-${VERSION}-1-x86_64.pkg.tar.zst"

          mkdir -p pkg/usr/bin
          mkdir -p pkg/usr/share/applications
          mkdir -p pkg/usr/share/icons/hicolor/256x256/apps
          mkdir -p pkg/usr/share/licenses/terx-bin

          if [ -f src-tauri/target/release/ter-x ]; then
            cp src-tauri/target/release/ter-x pkg/usr/bin/
          else
            cp src-tauri/target/release/terx pkg/usr/bin/ter-x
          fi
          chmod 755 pkg/usr/bin/ter-x
          ln -sf ter-x pkg/usr/bin/terx

          find src-tauri/target/release/bundle -name "*.desktop" -exec cp {} pkg/usr/share/applications/terx.desktop \; 2>/dev/null || \
            echo -e "[Desktop Entry]\nName=terX\nExec=terx\nIcon=terx\nType=Application\nCategories=Network;RemoteAccess;" > pkg/usr/share/applications/terx.desktop
          cp src-tauri/icons/128x128.png pkg/usr/share/icons/hicolor/256x256/apps/terx.png 2>/dev/null || true

          echo "terX is proprietary software. See https://github.com/OutrageLabs/terX" > pkg/usr/share/licenses/terx-bin/LICENSE

          cat > pkg/.PKGINFO << EOF
          pkgname = terx-bin
          pkgver = ${VERSION}-1
          pkgbase = terx-bin
          pkgdesc = Cross-platform SSH client with GPU-accelerated terminal rendering
          url = https://github.com/OutrageLabs/terX
          builddate = $(date +%s)
          packager = GitHub Actions
          size = $(du -sb pkg/usr | cut -f1)
          arch = x86_64
          license = custom:proprietary
          depend = webkit2gtk-4.1
          depend = gtk3
          depend = glib2
          depend = gdk-pixbuf2
          depend = cairo
          depend = pango
          depend = libsoup3
          depend = openssl
          depend = hicolor-icon-theme
          optdepend = libappindicator-gtk3: system tray support
          EOF

          cd pkg
          tar --zstd -cf "../${PKG_NAME}" .PKGINFO *
          cd ..

          mkdir -p output
          mv "${PKG_NAME}" output/

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Arch-x64
          path: output/*.pkg.tar.zst
          if-no-files-found: error

  publish-release:
    needs: [build, build-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: 'terX ${{ env.VERSION }}'
          body: |
            Release notes will be updated shortly...
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.pkg.tar.zst

  update-changelog:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: OutrageLabs/terx-source
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          owner: OutrageLabs
          repo: terx-source
          toTag: ${{ env.VERSION }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          mode: COMMIT
          configurationJson: |
            {
              "categories": [
                { "title": "### New Features", "labels": [] },
                { "title": "### Bug Fixes", "labels": [] },
                { "title": "### Maintenance", "labels": [] }
              ],
              "template": "#{{CHANGELOG}}",
              "commit_template": "- #{{TITLE}}",
              "transformers": [
                { "pattern": "^feat(\\(.+\\))?:", "target": "### New Features" },
                { "pattern": "^fix(\\(.+\\))?:", "target": "### Bug Fixes" },
                { "pattern": "^(chore|ci|docs|refactor)(\\(.+\\))?:", "target": "### Maintenance" }
              ],
              "commitMode": true
            }

      - name: Update CHANGELOG.md in private repo
        env:
          CHANGELOG_CONTENT: ${{ steps.changelog.outputs.changelog }}
          TAG_VERSION: ${{ env.VERSION }}
        run: |
          DATE=$(date +%Y-%m-%d)
          head -7 CHANGELOG.md > CHANGELOG.new
          cat >> CHANGELOG.new << ENTRY
          ## [${TAG_VERSION}] - ${DATE}

          ${CHANGELOG_CONTENT}

          ENTRY
          tail -n +8 CHANGELOG.md >> CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md for ${TAG_VERSION}"
          git push origin main

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          path: public-repo

      - name: Update CHANGELOG.md in public repo
        env:
          TAG_VERSION: ${{ env.VERSION }}
        run: |
          cp CHANGELOG.md public-repo/
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md for ${TAG_VERSION}"
          git push

      - name: Update release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_CONTENT: ${{ steps.changelog.outputs.changelog }}
          TAG_VERSION: ${{ env.VERSION }}
        run: |
          printf '%s\n' "$CHANGELOG_CONTENT" > release_body.md
          gh release edit "${TAG_VERSION}" --notes-file release_body.md

  publish-aur:
    needs: publish-release
    runs-on: ubuntu-latest
    env:
      TAG_VERSION: ${{ env.VERSION }}
    steps:
      - name: Get version
        id: version
        env:
          TAG_VERSION: ${{ env.VERSION }}
        run: echo "version=${TAG_VERSION#v}" >> $GITHUB_OUTPUT

      - name: Wait for release assets
        run: sleep 60

      - name: Download and get SHA256
        id: sha256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          URL="https://github.com/OutrageLabs/terX/releases/download/v${VERSION}/terx-bin-${VERSION}-1-x86_64.pkg.tar.zst"
          curl -sLO "$URL"
          SHA256=$(sha256sum "terx-bin-${VERSION}-1-x86_64.pkg.tar.zst" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Generate PKGBUILD
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          cat > PKGBUILD << 'PKGEOF'
          # Maintainer: kofany <j@dabrowski.biz>
          pkgname=terx-bin
          pkgver=VERSION_PLACEHOLDER
          pkgrel=1
          pkgdesc="Cross-platform SSH client with GPU-accelerated terminal rendering"
          arch=('x86_64')
          url="https://github.com/OutrageLabs/terX"
          license=('custom:proprietary')
          depends=('webkit2gtk-4.1' 'gtk3' 'glib2' 'gdk-pixbuf2' 'cairo' 'pango' 'libsoup3' 'openssl' 'hicolor-icon-theme')
          optdepends=('libappindicator-gtk3: system tray support')
          provides=('terx')
          conflicts=('terx')
          options=('!strip' '!debug')
          source=("terx-bin-${pkgver}.pkg.tar.zst::https://github.com/OutrageLabs/terX/releases/download/v${pkgver}/terx-bin-${pkgver}-1-x86_64.pkg.tar.zst")
          sha256sums=('SHA256_PLACEHOLDER')
          noextract=("terx-bin-${pkgver}.pkg.tar.zst")

          package() {
              cd "${srcdir}"
              bsdtar -xf "terx-bin-${pkgver}.pkg.tar.zst" -C "${pkgdir}/"
              rm -f "${pkgdir}/.PKGINFO" "${pkgdir}/.BUILDINFO" "${pkgdir}/.MTREE" 2>/dev/null || true
          }
          PKGEOF
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" PKGBUILD
          sed -i "s/SHA256_PLACEHOLDER/${SHA256}/g" PKGBUILD

      - name: Generate .SRCINFO
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          cat > .SRCINFO << EOF
          pkgbase = terx-bin
          	pkgdesc = Cross-platform SSH client with GPU-accelerated terminal rendering
          	pkgver = ${VERSION}
          	pkgrel = 1
          	url = https://github.com/OutrageLabs/terX
          	arch = x86_64
          	license = custom:proprietary
          	depends = webkit2gtk-4.1
          	depends = gtk3
          	depends = glib2
          	depends = gdk-pixbuf2
          	depends = cairo
          	depends = pango
          	depends = libsoup3
          	depends = openssl
          	depends = hicolor-icon-theme
          	optdepends = libappindicator-gtk3: system tray support
          	provides = terx
          	conflicts = terx
          	options = !strip
          	options = !debug
          	noextract = terx-bin-${VERSION}.pkg.tar.zst
          	source = terx-bin-${VERSION}.pkg.tar.zst::https://github.com/OutrageLabs/terX/releases/download/v${VERSION}/terx-bin-${VERSION}-1-x86_64.pkg.tar.zst
          	sha256sums = ${SHA256}

          pkgname = terx-bin
          EOF

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: terx-bin
          pkgbuild: ./PKGBUILD
          commit_username: kofany
          commit_email: j@dabrowski.biz
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.version }}"
          assets: .SRCINFO
